<p>2024年，全市政府性基金收入150.05亿元，上级补助收入19.54亿元，待偿债再融资专项债券上年结余6.93亿元，上年结余收入7.13亿元，调入资金13.36亿元，专项债务（转贷）收入215.54亿元。</p>
