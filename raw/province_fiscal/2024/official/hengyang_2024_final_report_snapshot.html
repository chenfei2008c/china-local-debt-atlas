<body>
<p>来源网址：https://www.hengyang.gov.cn/czj/ztxx/czysjsgk/cxzyhyjsgk/ysjsbg/20250905/i3781107.html</p>
<p>来源机构：衡阳市财政局；发布日期：2025-09-05。</p>
<p>2024年，全市政府性基金预算收入142.18亿元，下降36.99%，加上年结余46.85亿元、上级补助收入23.05亿元、债务转贷收入255.02亿元、调入资金29.73亿元，收入总计496.83亿元。</p>
<p>市本级政府性基金预算收入86.65亿元，下降33.42%。</p>
